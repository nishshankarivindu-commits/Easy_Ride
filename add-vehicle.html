<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EasyRide | Add New Vehicle</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#008000", "background-dark": "#050a05", "accent-dark": "#0a0f0a" },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body { background-color: #050a05 !important; color: white !important; font-family: 'Inter', sans-serif; padding-top: 5rem; }
        .glass-card { background: rgba(10, 15, 10, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-field { background-color: #0a0f0a !important; border: 1px solid rgba(0, 128, 0, 0.2) !important; border-radius: 1rem !important; padding: 1rem 1rem 1rem 3.5rem !important; width: 100% !important; color: white !important; outline: none !important; transition: all 0.3s ease; }
        .input-field:focus { border-color: #008000 !important; box-shadow: 0 0 15px rgba(0, 128, 0, 0.2) !important; }
        select.input-field { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e") !important; }
        
        /* Global Navigation Styles */
        .glass-nav { 
            background: rgba(5, 10, 5, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 py-24">

    <nav class="fixed top-0 w-full z-[100] glass-nav">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <span class="material-icons text-primary text-3xl font-bold">directions_car</span>
                <h1 class="text-white text-xl font-black italic uppercase tracking-tighter">EasyRide</h1>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                <a href="index.html" class="hover:text-primary transition-all">Home</a>
                <a href="fleet.html" class="hover:text-primary transition-all">Explore Fleet</a>
                <a href="index.html#how-it-works" class="hover:text-primary transition-all">Support</a>
            </div>

            <div id="nav-actions" class="flex items-center gap-4">
                <a href="login.html" class="bg-white/5 hover:bg-white/10 px-6 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest border border-white/5 transition-all">Login</a>
            </div>
        </div>
    </nav>

    <div class="w-full max-w-3xl glass-card p-10 rounded-[2.5rem] shadow-2xl text-left mt-10">
        <header class="mb-10 flex justify-between items-center border-b border-white/5 pb-6">
            <h1 class="text-3xl font-black text-primary italic uppercase tracking-tighter">List <span class="text-white">Vehicle</span></h1>
            <a href="owner-dashboard.html" class="text-[10px] font-black text-slate-500 hover:text-white uppercase tracking-widest transition-all">Back to Hub</a>
        </header>

        <form id="vehicle-form" class="space-y-10">
            <section class="space-y-6">
                <h3 class="text-xs font-black text-primary uppercase tracking-[0.2em] mb-4">1. Vehicle Specifications</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="relative"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">directions_car</span><input id="car-model" required type="text" placeholder="Model (e.g. Vezel)" class="input-field text-sm"></div>
                    <div class="relative"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">tag</span><input id="reg-number" required type="text" placeholder="Reg No (e.g. CAI-3070)" class="input-field text-sm"></div>
                    <div class="relative"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">category</span>
                        <select id="car-type" class="input-field text-sm">
                            <option value="SUV">SUV</option><option value="Economy">Economy</option><option value="Luxury">Luxury</option>
                        </select>
                    </div>
                    <div class="relative"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">event</span><input id="man-year" required type="text" placeholder="Year (e.g. 2020)" class="input-field text-sm"></div>
                    <div class="relative md:col-span-2"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">verified_user</span>
                        <select id="insurance-type" class="input-field text-sm">
                            <option>Comprehensive Coverage</option><option>Third-Party Liability</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="space-y-6">
                <h3 class="text-xs font-black text-primary uppercase tracking-[0.2em] mb-4">2. Owner Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="relative"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">person</span><input id="owner-name" required type="text" placeholder="Owner's Name" class="input-field text-sm"></div>
                    <div class="relative"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">phone</span><input id="owner-phone" required type="text" placeholder="Owner's Phone" class="input-field text-sm"></div>
                </div>
            </section>

            <section class="space-y-6">
                <h3 class="text-xs font-black text-primary uppercase tracking-[0.2em] mb-4">3. Pricing & Pickup</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="relative"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">payments</span><input id="car-price" required type="number" placeholder="Daily Rate" class="input-field text-sm font-bold"></div>
                    <div class="relative"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">savings</span><input id="monthly-price" required type="number" placeholder="Monthly Rate" class="input-field text-sm font-bold"></div>
                    <div class="relative md:col-span-2"><span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">location_on</span><input id="car-location" required type="text" placeholder="Pickup City (e.g. Matara)" class="input-field text-sm"></div>
                </div>
            </section>

            <section class="space-y-4">
                <div id="drop-zone" class="border-2 border-dashed border-primary/20 p-10 rounded-[2rem] text-center cursor-pointer hover:bg-primary/5 transition-all">
                    <span class="material-icons text-4xl text-primary mb-2">cloud_upload</span>
                    <p id="file-name" class="text-[10px] font-black uppercase text-slate-400">Click to upload vehicle photo</p>
                    <input type="file" id="file-input" class="hidden" accept="image/*" required>
                </div>
            </section>

            <button id="submit-btn" class="w-full bg-primary hover:bg-emerald-600 py-5 rounded-2xl font-black text-sm text-white uppercase tracking-widest shadow-2xl transition-all active:scale-95">List Vehicle Now</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _supabase = supabase.createClient('https://mgzvrwlztdzkaasngqxh.supabase.co', 'sb_publishable_53m4C0gq1eGMRkjvbZ2-9w_F4mIKRCB');
        const fileInput = document.getElementById('file-input');

        document.getElementById('drop-zone').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => { if(fileInput.files.length) document.getElementById('file-name').innerText = "Selected: " + fileInput.files[0].name; });

        // --- GLOBAL NAVBAR SETUP ---
        async function setupNavbar() {
            const { data: { session } } = await _supabase.auth.getSession();
            const navActions = document.getElementById('nav-actions');
            if (session) {
                const { data: prof } = await _supabase.from('profiles').select('role').eq('id', session.user.id).single();
                const dashboardLink = prof?.role === 'owner' ? 'owner-dashboard.html' : 'customer-dashboard.html';
                const dashboardName = prof?.role === 'owner' ? 'Owner Hub' : 'My Bookings';
                navActions.innerHTML = `
                    <div class="flex items-center gap-4">
                        <a href="${dashboardLink}" class="bg-primary/20 text-primary hover:bg-primary hover:text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all">${dashboardName}</a>
                        <button onclick="handleLogout()" class="text-red-500 hover:text-red-400 transition-all"><span class="material-icons text-xl">logout</span></button>
                    </div>`;
            }
        }

        async function handleLogout() {
            if(confirm("Logout වෙන්න ෂුවර්ද?")) {
                await _supabase.auth.signOut();
                window.location.href = 'index.html';
            }
        }

        // FORM SUBMISSION
        document.getElementById('vehicle-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "LISTING..."; btn.disabled = true;

            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) throw new Error("Please login first!");

                const file = fileInput.files[0];
                const fileName = `${Date.now()}-${file.name}`;
                const { error: stErr } = await _supabase.storage.from('vehicle-images').upload(fileName, file);
                if (stErr) throw stErr;

                const { data: urlData } = _supabase.storage.from('vehicle-images').getPublicUrl(fileName);

                const carData = {
                    name: document.getElementById('car-model').value,
                    reg_number: document.getElementById('reg-number').value,
                    type: document.getElementById('car-type').value,
                    man_year: document.getElementById('man-year').value.toString(),
                    insurance: document.getElementById('insurance-type').value,
                    price: parseInt(document.getElementById('car-price').value),
                    monthly_price: parseInt(document.getElementById('monthly-price').value),
                    location: document.getElementById('car-location').value,
                    owner_name: document.getElementById('owner-name').value,
                    owner_phone: document.getElementById('owner-phone').value,
                    owner_id: session.user.id,
                    image_url: urlData.publicUrl
                };

                const { error: dbErr } = await _supabase.from('cars').insert([carData]);
                if (dbErr) throw dbErr;
                alert("Success!"); window.location.href = 'owner-dashboard.html';
            } catch (err) { 
                console.error("Error Detail:", err);
                alert("Error: " + err.message); 
                btn.innerText = "List Vehicle Now"; btn.disabled = false; 
            }
        });

        window.onload = setupNavbar;
    </script>
</body>
</html>
