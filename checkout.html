<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EasyRide | Checkout</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#008000", "background-dark": "#050a05", "accent-dark": "#0a0f0a" },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050a05 !important; color: white; }
        .glass { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .btn-hover:hover { box-shadow: 0 0 20px rgba(0, 128, 0, 0.4); }
    </style>
</head>
<body class="antialiased font-display min-h-screen">

    <header class="sticky top-0 z-50 w-full border-b border-white/5 glass text-left">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
            <button onclick="history.back()" class="flex items-center gap-2 text-slate-500 hover:text-white transition-all font-bold text-[10px] uppercase">
                <span class="material-icons text-sm">arrow_back</span> Back
            </button>
            <h2 class="text-primary text-xl font-black italic uppercase tracking-tighter cursor-pointer" onclick="window.location.href='index.html'">EasyRide</h2>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            
            <div class="lg:col-span-2 space-y-8 text-left">
                <section class="bg-accent-dark border border-white/5 rounded-3xl p-8 shadow-2xl">
                    <h3 class="text-lg font-black text-white mb-8 flex items-center gap-3 italic uppercase">
                        <span class="material-icons text-primary">edit_note</span> Reservation Details
                    </h3>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-3">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Contact Phone Number</label>
                            <div class="relative">
                                <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600 text-lg">phone</span>
                                <input id="customer-phone" type="number" placeholder="07XXXXXXXX" 
                                    class="w-full bg-white/5 border-white/10 rounded-2xl pl-12 pr-4 py-4 text-white focus:border-primary outline-none transition-all">
                            </div>
                        </div>

                        <div class="space-y-3">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Rental Plan</label>
                            <div class="relative">
                                <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600 text-lg">history</span>
                                <select id="rental-type" onchange="updateUI()" class="w-full bg-white/5 border-white/10 rounded-2xl pl-12 pr-4 py-4 text-white focus:border-primary outline-none transition-all appearance-none">
                                    <option value="daily">Daily Rental</option>
                                    <option value="monthly">Monthly Lease</option>
                                </select>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <label id="duration-label" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Number of Days</label>
                            <div class="relative">
                                <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-600 text-lg">calendar_month</span>
                                <input id="duration-input" type="number" value="1" min="1" oninput="calculateTotal()"
                                    class="w-full bg-white/5 border-white/10 rounded-2xl pl-12 pr-4 py-4 text-white focus:border-primary outline-none transition-all">
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="space-y-6 text-left">
                <div class="bg-accent-dark border border-white/5 rounded-3xl overflow-hidden shadow-2xl">
                    <div id="car-loading" class="p-20 text-center">
                        <p class="animate-pulse text-slate-600 text-[10px] font-bold uppercase tracking-widest">Fetching Car...</p>
                    </div>
                    
                    <div id="car-card" class="hidden">
                        <img id="car-img" class="w-full aspect-video object-cover" src="" alt="Car" onerror="this.src='https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?q=80&w=800'"/>
                        <div class="p-8">
                            <h4 id="car-name" class="text-2xl font-black text-white uppercase italic tracking-tighter">---</h4>
                            <p id="car-meta" class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-8">---</p>
                            
                            <div class="space-y-4 pt-6 border-t border-white/5">
                                <div class="flex justify-between text-xs font-bold">
                                    <span class="text-slate-500 uppercase tracking-widest">Rate</span>
                                    <span id="rate-display" class="text-white">LKR 0</span>
                                </div>
                                <div class="flex justify-between items-center pt-4 border-t border-white/10">
                                    <p class="text-primary font-black text-sm uppercase italic">Total Price</p>
                                    <p id="total-price" class="text-primary font-black text-3xl tracking-tighter">LKR 0</p>
                                </div>
                            </div>

                            <button id="book-btn" onclick="confirmBooking()" class="w-full bg-primary hover:bg-emerald-600 py-5 rounded-2xl font-black text-lg text-white mt-8 active:scale-95 transition-all btn-hover">
                                CONFIRM BOOKING
                            </button>
                            <p class="text-[9px] text-slate-600 uppercase font-bold text-center mt-4 tracking-widest">By confirming, you agree to our terms & conditions.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _supabase = supabase.createClient('https://mgzvrwlztdzkaasngqxh.supabase.co', 'sb_publishable_53m4C0gq1eGMRkjvbZ2-9w_F4mIKRCB');
        const urlParams = new URLSearchParams(window.location.search);
        const carId = urlParams.get('id');

        let activeCar = null;
        let userData = null;

        async function init() {
            if (!carId) { window.location.href = 'fleet.html'; return; }

            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }

            // Profile fetch with Safe Handling (මෙතන තමයි කලින් error එක ආවේ)
            const { data: prof } = await _supabase.from('profiles').select('*').eq('id', session.user.id).single();
            
            if (prof) {
                userData = prof;
                if(prof.phone_number) document.getElementById('customer-phone').value = prof.phone_number;
            } else {
                // Profile එක නැත්නම් account එක crash වෙන්න දෙන්නේ නැහැ
                userData = { full_name: session.user.email.split('@')[0], phone_number: "" };
                console.warn("Profile record not found. Falling back to session email.");
            }

            fetchVehicle();
        }

        async function fetchVehicle() {
            try {
                const { data: car, error } = await _supabase.from('cars').select('*').eq('id', carId).single();
                if (error || !car) throw error;
                activeCar = car;

                // Update UI
                document.getElementById('car-img').src = car.image_url;
                document.getElementById('car-name').innerText = car.name;
                document.getElementById('car-meta').innerText = (car.location || 'Anywhere') + " • " + (car.type || 'Economy');
                
                document.getElementById('car-loading').classList.add('hidden');
                document.getElementById('car-card').classList.remove('hidden');
                
                calculateTotal();
            } catch (e) {
                alert("Error loading car data: " + e.message);
                window.location.href = 'fleet.html';
            }
        }

        function updateUI() {
            const type = document.getElementById('rental-type').value;
            document.getElementById('duration-label').innerText = type === 'daily' ? 'Number of Days' : 'Number of Months';
            calculateTotal();
        }

        function calculateTotal() {
            if (!activeCar) return;
            const type = document.getElementById('rental-type').value;
            const duration = parseInt(document.getElementById('duration-input').value) || 1;
            
            let total = 0;
            if (type === 'daily') {
                total = activeCar.price * duration;
                document.getElementById('rate-display').innerText = "LKR " + activeCar.price.toLocaleString() + " /day";
            } else {
                // Monthly discount (20% off)
                const monthlyRate = (activeCar.price * 30) * 0.8;
                total = monthlyRate * duration;
                document.getElementById('rate-display').innerText = "LKR " + monthlyRate.toLocaleString() + " /month";
            }
            document.getElementById('total-price').innerText = "LKR " + total.toLocaleString();
        }

        async function confirmBooking() {
            const phone = document.getElementById('customer-phone').value;
            const type = document.getElementById('rental-type').value;
            const duration = document.getElementById('duration-input').value;
            const finalPriceString = document.getElementById('total-price').innerText.replace("LKR ", "").replace(/,/g, "");

            if(!phone) { alert("Please enter your phone number!"); return; }

            const btn = document.getElementById('book-btn');
            btn.innerText = "SAVING..."; btn.disabled = true;

            try {
                const { error } = await _supabase.from('bookings').insert([{
                    car_id: activeCar.id,
                    car_name: activeCar.name,
                    customer_name: userData.full_name,
                    customer_phone: phone,
                    rental_type: type,
                    duration: parseInt(duration),
                    total_price: parseFloat(finalPriceString),
                    status: 'Pending'
                }]);

                if (error) throw error;
                alert("✅ Booking Success!");
                window.location.href = 'my-bookings.html';
            } catch (err) {
                alert("Booking Failed: " + err.message);
                btn.innerText = "CONFIRM BOOKING"; btn.disabled = false;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
