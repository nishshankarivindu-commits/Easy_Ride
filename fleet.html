<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EasyRide | Explore Fleet</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#008000", "background-dark": "#050a05", "accent-dark": "#0a0f0a" },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050a05 !important; color: white; padding-top: 5rem; }
        .glass { background: rgba(10, 15, 10, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* New Global Nav Style */
        .glass-nav { 
            background: rgba(5, 10, 5, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        select {
            background-color: #0a0f0a !important;
            border: 1px solid rgba(0, 128, 0, 0.2) !important;
            color: white !important;
            border-radius: 1rem !important;
            padding: 1rem !important;
            outline: none !important;
        }

        input[type="range"] { -webkit-appearance: none; background: rgba(0, 128, 0, 0.1); height: 4px; border-radius: 5px; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #008000; border: 2px solid #050a05; box-shadow: 0 0 10px rgba(0, 128, 0, 0.5); }

        .card-hover:hover { border-color: rgba(0, 128, 0, 0.4); transform: translateY(-5px); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #008000; border-radius: 10px; }
    </style>
</head>
<body class="antialiased font-display min-h-screen custom-scrollbar">

    <nav class="fixed top-0 w-full z-[100] glass-nav">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <span class="material-icons text-primary text-3xl font-bold">directions_car</span>
                <h1 class="text-white text-xl font-black italic uppercase tracking-tighter">EasyRide</h1>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                <a href="index.html" class="hover:text-primary transition-all">Home</a>
                <a href="fleet.html" class="text-primary transition-all">Explore Fleet</a>
                <a href="index.html#how-it-works" class="hover:text-primary transition-all">Support</a>
            </div>

            <div id="nav-actions" class="flex items-center gap-4">
                <a href="login.html" class="bg-white/5 hover:bg-white/10 px-6 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest border border-white/5 transition-all">Login</a>
            </div>
        </div>
    </nav>

    <div class="mx-auto max-w-7xl px-6 py-10 flex flex-col lg:flex-row gap-10">
        
        <aside class="w-full lg:w-72 shrink-0">
            <div class="glass p-8 rounded-[2.5rem] sticky top-32 space-y-8">
                <h3 class="text-xs font-black uppercase tracking-[0.2em] text-primary flex items-center gap-2">
                    <span class="material-icons text-sm">tune</span> Filter Rides
                </h3>

                <div class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase">Pickup Location</label>
                        <select id="filter-location" onchange="applyFilters()" class="w-full text-[10px] font-bold uppercase">
                            <option value="all">All Island</option>
                            <option value="Colombo">Colombo</option>
                            <option value="Galle">Galle</option>
                            <option value="Matara">Matara</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase">Insurance Type</label>
                        <select id="filter-insurance" onchange="applyFilters()" class="w-full text-[10px] font-bold uppercase">
                            <option value="all">All Insurances</option>
                            <option value="Comprehensive">Comprehensive</option>
                            <option value="Third-Party">Third-Party</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="text-[9px] font-black text-slate-500 uppercase">Max Daily Price</label>
                            <span id="price-val" class="text-[9px] font-black text-primary uppercase">100,000</span>
                        </div>
                        <input type="range" id="filter-price" min="2000" max="100000" step="1000" value="100000" 
                               oninput="document.getElementById('price-val').innerText = parseInt(this.value).toLocaleString()" 
                               onchange="applyFilters()" class="w-full">
                    </div>
                </div>

                <button onclick="resetFilters()" class="w-full text-[9px] font-black text-slate-600 hover:text-white uppercase tracking-widest transition-all">
                    Clear Filters
                </button>
            </div>
        </aside>

        <main class="flex-1">
            <div id="fleet-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _supabase = supabase.createClient('https://mgzvrwlztdzkaasngqxh.supabase.co', 'sb_publishable_53m4C0gq1eGMRkjvbZ2-9w_F4mIKRCB');
        let rawCars = [];

        async function initFleet() {
            // Updated Navbar Logic
            setupNavbar();

            const { data: cars, error } = await _supabase.from('cars').select('*');
            if (error) return console.error(error);
            rawCars = cars;
            render(rawCars);
        }

        // --- NEW: Global Navbar Setup Function ---
        async function setupNavbar() {
            const { data: { session } } = await _supabase.auth.getSession();
            const navActions = document.getElementById('nav-actions');

            if (session) {
                // Role එක බලලා Dashboard බටන් එක හදනවා
                const { data: prof } = await _supabase.from('profiles').select('role, full_name').eq('id', session.user.id).single();
                
                const dashboardLink = prof?.role === 'owner' ? 'owner-dashboard.html' : 'customer-dashboard.html';
                const dashboardName = prof?.role === 'owner' ? 'Owner Hub' : 'My Bookings';

                navActions.innerHTML = `
                    <div class="flex items-center gap-4">
                        <a href="${dashboardLink}" class="bg-primary hover:bg-emerald-600 px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all">
                            ${dashboardName}
                        </a>
                        <button onclick="handleLogout()" class="text-red-500 hover:text-red-400 transition-all">
                            <span class="material-icons text-xl">logout</span>
                        </button>
                    </div>
                `;
            }
        }

        function render(cars) {
            const grid = document.getElementById('fleet-grid');
            grid.innerHTML = "";

            if (!cars.length) {
                grid.innerHTML = `<div class="col-span-full py-24 text-center text-slate-700 font-black uppercase tracking-[0.3em] italic">No matching vehicles found.</div>`;
                return;
            }

            cars.forEach(c => {
                grid.innerHTML += `
                    <div class="glass rounded-[2.5rem] overflow-hidden border border-white/5 transition-all duration-500 card-hover flex flex-col group">
                        <div class="relative aspect-[16/10] overflow-hidden">
                            <img src="${c.image_url}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <div class="absolute top-4 right-4 bg-primary px-3 py-1 rounded-lg shadow-lg">
                                <p class="text-[9px] font-black text-white uppercase">${c.man_year || '2024'}</p>
                            </div>
                            <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-lg border border-white/10">
                                <p class="text-[9px] font-bold text-white uppercase">${c.type || 'Economy'}</p>
                            </div>
                        </div>
                        <div class="p-8 flex-1 flex flex-col">
                            <div class="flex justify-between items-start mb-6">
                                <div>
                                    <h3 class="text-xl font-black text-white italic uppercase tracking-tighter">${c.name}</h3>
                                    <div class="flex items-center gap-2 mt-2">
                                        <span class="text-[9px] font-black text-primary uppercase border border-primary/30 px-2 py-0.5 rounded">${c.reg_number || 'N/A'}</span>
                                        <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">${c.location}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <p class="text-[9px] text-slate-500 font-medium uppercase tracking-widest mb-6">
                                <span class="material-icons text-[10px] align-middle mr-1 text-primary">verified_user</span> 
                                ${c.insurance || 'Comprehensive Coverage'}
                            </p>

                            <div class="mt-auto pt-6 border-t border-white/5 flex justify-between items-center">
                                <div>
                                    <p class="text-[8px] font-black text-slate-600 uppercase tracking-widest">Rate Per Day</p>
                                    <p class="text-xl font-black text-white italic tracking-tighter">LKR ${c.price.toLocaleString()}</p>
                                </div>
                                <button onclick="handleBooking('${c.id}', '${c.name}', ${c.price}, '${c.image_url}')" 
                                    class="bg-white/5 hover:bg-primary text-white px-7 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all shadow-xl hover:shadow-primary/20">
                                    Book Now
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function handleBooking(id, name, price, img) {
            const bookingData = { id, name, price, img };
            localStorage.setItem('selectedCar', JSON.stringify(bookingData));
            window.location.href = 'booking.html';
        }

        function applyFilters() {
            const loc = document.getElementById('filter-location').value.toLowerCase();
            const ins = document.getElementById('filter-insurance').value.toLowerCase();
            const maxPrice = parseInt(document.getElementById('filter-price').value);

            const filtered = rawCars.filter(car => {
                const matchLoc = loc === 'all' || (car.location || "").toLowerCase().includes(loc);
                const matchIns = ins === 'all' || (car.insurance || "").toLowerCase().includes(ins);
                const matchPrice = car.price <= maxPrice;
                return matchLoc && matchIns && matchPrice;
            });
            render(filtered);
        }

        function resetFilters() {
            document.getElementById('filter-location').value = 'all';
            document.getElementById('filter-insurance').value = 'all';
            document.getElementById('filter-price').value = 100000;
            document.getElementById('price-val').innerText = "100,000";
            render(rawCars);
        }

        async function handleLogout() { 
            if(confirm("Logout වෙන්න ෂුවර්ද මචං?")) {
                await _supabase.auth.signOut(); 
                window.location.href = 'index.html'; 
            }
        }

        window.onload = initFleet;
    </script>
</body>
</html>
