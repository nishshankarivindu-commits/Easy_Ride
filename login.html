<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EasyRide | Access Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#008000", "background-dark": "#050a05", "accent-dark": "#0a0f0a" },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        /* Body Padding - Navigation එකට ඉඩ තැබීම */
        body { font-family: 'Inter', sans-serif; background-color: #050a05 !important; color: white; padding-top: 80px; }
        
        .hero-gradient { background: radial-gradient(circle at 50% 50%, #00800010 0%, #050a05 100%); }
        
        /* Navigation Style */
        .glass-nav { 
            background: rgba(5, 10, 5, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        .glass-card { background: rgba(10, 15, 10, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Input Box Fix: Icons වලට ඉඩ තැබීම */
        .input-box { 
            background: rgba(255, 255, 255, 0.05) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            border-radius: 1rem !important; 
            padding: 1.1rem 1.1rem 1.1rem 3.5rem !important; 
            width: 100% !important; 
            outline: none !important; 
            transition: all 0.3s; 
            color: white !important; 
        }
        
        .input-box:focus { border-color: #008000 !important; box-shadow: 0 0 15px rgba(0, 128, 0, 0.2) !important; }

        .input-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #4b5563;
            font-size: 1.3rem;
            pointer-events: none;
        }

        .tab-btn { padding: 0.8rem; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; border-radius: 0.8rem; cursor: pointer; transition: 0.3s; }
        .active-tab { background: #008000; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col hero-gradient antialiased">

    <nav class="fixed top-0 w-full z-[100] glass-nav">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <span class="material-icons text-primary text-3xl font-bold">directions_car</span>
                <h1 class="text-white text-xl font-black italic uppercase tracking-tighter">EasyRide</h1>
            </div>
            
            <div class="hidden md:flex items-center gap-10 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                <a href="index.html" class="hover:text-primary transition-all">Home</a>
                <a href="fleet.html" class="hover:text-primary transition-all">Explore Fleet</a>
                <a href="index.html#how-it-works" class="hover:text-primary transition-all">Support</a>
            </div>

            <div id="nav-actions">
                <a href="index.html" class="text-slate-500 hover:text-white text-[10px] font-black uppercase tracking-widest transition-all">Cancel</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6 mt-10">
        <div class="w-full max-w-md glass-card p-10 rounded-[2.5rem] shadow-2xl relative z-10 text-center">
            
            <div class="flex bg-white/5 p-1 rounded-2xl mb-10">
                <button id="login-tab-btn" onclick="switchTab('login')" class="tab-btn flex-1 active-tab">Login</button>
                <button id="signup-tab-btn" onclick="switchTab('signup')" class="tab-btn flex-1 text-slate-500">Sign Up</button>
            </div>

            <form id="login-form" class="space-y-5 text-left">
                <div class="relative">
                    <span class="material-icons input-icon">email</span>
                    <input id="login-email" type="email" required placeholder="Email Address" class="input-box text-sm">
                </div>
                <div class="relative">
                    <span class="material-icons input-icon">lock</span>
                    <input id="login-password" type="password" required placeholder="Password" class="input-box text-sm">
                </div>
                <button type="submit" id="login-submit" class="w-full bg-primary hover:bg-emerald-600 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all shadow-lg shadow-primary/20">Sign In</button>
            </form>

            <form id="signup-form" class="space-y-5 text-left hidden">
                <div class="relative">
                    <span class="material-icons input-icon">person</span>
                    <input id="signup-name" type="text" required placeholder="Full Name" class="input-box text-sm">
                </div>
                <div class="relative">
                    <span class="material-icons input-icon">email</span>
                    <input id="signup-email" type="email" required placeholder="Email Address" class="input-box text-sm">
                </div>
                <div class="relative">
                    <span class="material-icons input-icon">lock</span>
                    <input id="signup-password" type="password" required placeholder="Create Password" class="input-box text-sm">
                </div>
                <div class="relative">
                    <span class="material-icons input-icon">category</span>
                    <select id="signup-role" class="input-box text-sm appearance-none cursor-pointer">
                        <option value="customer" class="bg-black">Customer (Rent a Car)</option>
                        <option value="owner" class="bg-black">Owner (List my Car)</option>
                    </select>
                </div>
                <button type="submit" id="signup-submit" class="w-full bg-primary hover:bg-emerald-600 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all shadow-lg shadow-primary/20">Create Account</button>
            </form>
        </div>
    </main>

    <footer class="py-12 border-t border-white/5 text-center mt-10">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-2">
                <span class="material-icons text-primary text-xl font-bold">directions_car</span>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">EasyRide Fleet</p>
            </div>
            <p class="text-[9px] font-bold text-slate-600 uppercase tracking-[0.5em]">&copy; 2026 EasyRide Sri Lanka.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _supabase = supabase.createClient('https://mgzvrwlztdzkaasngqxh.supabase.co', 'sb_publishable_53m4C0gq1eGMRkjvbZ2-9w_F4mIKRCB');

        function switchTab(tab) {
            document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
            document.getElementById('signup-form').classList.toggle('hidden', tab === 'login');
            document.getElementById('login-tab-btn').className = tab === 'login' ? 'tab-btn flex-1 active-tab' : 'tab-btn flex-1 text-slate-500';
            document.getElementById('signup-tab-btn').className = tab === 'signup' ? 'tab-btn flex-1 active-tab' : 'tab-btn flex-1 text-slate-500';
        }

        // --- LOGIN LOGIC ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-submit');
            btn.innerText = "VERIFYING..."; btn.disabled = true;

            try {
                const { data: auth, error: authErr } = await _supabase.auth.signInWithPassword({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value
                });
                if (authErr) throw authErr;

                const { data: prof, error: profErr } = await _supabase.from('profiles').select('role').eq('id', auth.user.id).single();
                
                if (profErr || !prof) {
                    window.location.href = 'fleet.html';
                } else {
                    handleRedirect(prof.role);
                }
            } catch (err) {
                alert("Login Error: " + err.message);
                btn.innerText = "Sign In"; btn.disabled = false;
            }
        });

        // --- SIGNUP LOGIC ---
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signup-submit');
            btn.innerText = "CREATING..."; btn.disabled = true;

            try {
                const email = document.getElementById('signup-email').value;
                const { data: auth, error: authErr } = await _supabase.auth.signUp({
                    email: email,
                    password: document.getElementById('signup-password').value
                });
                if (authErr) throw authErr;

                if (auth.user) {
                    await _supabase.from('profiles').insert([{
                        id: auth.user.id,
                        full_name: document.getElementById('signup-name').value,
                        role: document.getElementById('signup-role').value,
                        email: email
                    }]);
                    alert("Account Created! You can now Login.");
                    switchTab('login');
                }
            } catch (err) { alert(err.message); }
            finally { btn.innerText = "Create Account"; btn.disabled = false; }
        });

        // --- REDIRECT LOGIC ---
        function handleRedirect(role) {
            const r = role.toLowerCase().trim();
            if (r === 'admin') window.location.href = 'admin.html';
            else if (r === 'owner') window.location.href = 'owner-dashboard.html';
            else window.location.href = 'fleet.html';
        }

        // AUTO REDIRECT IF SESSION EXISTS
        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                const { data: prof } = await _supabase.from('profiles').select('role').eq('id', session.user.id).single();
                if (prof) handleRedirect(prof.role);
            }
        };
    </script>
</body>
</html>
