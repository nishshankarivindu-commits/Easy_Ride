<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EasyRide | Create Account</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#008000", "background-dark": "#050a05", "accent-dark": "#0a0f0a" },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050a05 !important; color: white; padding-top: 5rem; }
        .hero-gradient { background: radial-gradient(circle at 50% 50%, #00800010 0%, #050a05 100%); }
        .glass-nav { background: rgba(5, 10, 5, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: rgba(10, 15, 10, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Input Field Styling with Icons */
        .input-box { 
            background: rgba(255, 255, 255, 0.05) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            border-radius: 1.2rem !important; 
            padding: 1.1rem 1.1rem 1.1rem 3.5rem !important; 
            width: 100% !important; 
            outline: none !important; 
            transition: all 0.3s; 
            color: white !important; 
        }
        .input-box:focus { border-color: #008000 !important; box-shadow: 0 0 20px rgba(0, 128, 0, 0.2) !important; }

        .input-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #4b5563;
            font-size: 1.3rem;
            pointer-events: none;
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #008000; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col hero-gradient antialiased">

    <nav class="fixed top-0 w-full z-[100] glass-nav">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <span class="material-icons text-primary text-3xl font-bold">directions_car</span>
                <h1 class="text-white text-xl font-black italic uppercase tracking-tighter text-left">EasyRide</h1>
            </div>
            
            <div class="hidden md:flex items-center gap-10 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                <a href="index.html" class="hover:text-primary transition-all">Home</a>
                <a href="fleet.html" class="hover:text-primary transition-all">Explore Fleet</a>
            </div>

            <div id="nav-actions">
                <a href="login.html" class="bg-white/5 hover:bg-white/10 px-6 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest border border-white/5 transition-all">Login</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md glass-card p-10 rounded-[3rem] shadow-2xl relative z-10 text-center">
            
            <div class="flex justify-center mb-6">
                <div class="size-16 bg-primary/10 rounded-2xl flex items-center justify-center border border-primary/20">
                    <span class="material-icons text-primary text-4xl">person_add</span>
                </div>
            </div>

            <h2 class="text-3xl font-black text-white uppercase italic tracking-tighter mb-2">Create <span class="text-primary">Account</span></h2>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-10 text-center">Join the EasyRide Experience</p>

            <form id="signup-form" class="space-y-5 text-left">
                <div class="relative">
                    <span class="material-icons input-icon">person</span>
                    <input id="fullname" type="text" required placeholder="Full Name" class="input-box text-sm">
                </div>

                <div class="relative">
                    <span class="material-icons input-icon">category</span>
                    <select id="role" class="input-box text-sm appearance-none cursor-pointer">
                        <option value="customer" class="bg-black">Customer (Rent a Car)</option>
                        <option value="owner" class="bg-black">Owner (List my Car)</option>
                    </select>
                </div>

                <div class="relative">
                    <span class="material-icons input-icon">email</span>
                    <input id="email" type="email" required placeholder="Email Address" class="input-box text-sm">
                </div>

                <div class="relative">
                    <span class="material-icons input-icon">lock</span>
                    <input id="password" type="password" required placeholder="Create Password (Min 6 chars)" class="input-box text-sm">
                </div>
                
                <button id="signup-btn" class="w-full bg-primary hover:bg-emerald-600 py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] transition-all shadow-xl shadow-primary/20 active:scale-95 mt-4">
                    Sign Up Now
                </button>
            </form>

            <p class="text-center mt-8 text-[10px] text-slate-500 font-bold uppercase tracking-widest">
                Already have an account? <a href="login.html" class="text-primary hover:underline">Sign In</a>
            </p>
        </div>
    </main>

    <footer class="py-10 border-t border-white/5 text-center">
        <p class="text-[9px] font-bold text-slate-600 uppercase tracking-[0.5em]">&copy; 2026 EasyRide Sri Lanka. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _supabase = supabase.createClient('https://mgzvrwlztdzkaasngqxh.supabase.co', 'sb_publishable_53m4C0gq1eGMRkjvbZ2-9w_F4mIKRCB');

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            btn.innerText = "INITIALIZING..."; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullname').value;
            const role = document.getElementById('role').value;

            try {
                // 1. Supabase Auth Sign Up
                const { data: authData, error: authError } = await _supabase.auth.signUp({ email, password });
                if (authError) throw authError;

                // 2. Profile Table Insert
                if (authData.user) {
                    const { error: profError } = await _supabase.from('profiles').insert([{
                        id: authData.user.id,
                        full_name: fullName,
                        role: role,
                        email: email
                    }]);
                    if (profError) throw profError;
                    
                    alert("✅ Success! Please confirm your email and then Login.");
                    window.location.href = 'login.html';
                }

            } catch (err) { 
                alert("Sign Up Error: " + err.message); 
                btn.innerText = "Sign Up Now"; btn.disabled = false; 
            }
        });

        // ලොග් වෙලා නම් කෙලින්ම Dashboard එකට යවනවා
        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                const { data: prof } = await _supabase.from('profiles').select('role').eq('id', session.user.id).single();
                if (prof) {
                    if (prof.role === 'owner') window.location.href = 'owner-dashboard.html';
                    else window.location.href = 'fleet.html';
                }
            }
        };
    </script>
</body>
</html>
